<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="neon-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2338"/>
      <stop offset="50%" stop-color="#0E1326"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#090B14"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E8"/>
      <stop offset="100%" stop-color="#FED8C4"/>
    </linearGradient>
    <linearGradient id="holoRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#B6FF00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="portalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#B6FF00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Holographic Base Platform -->
  <g transform="translate(0, 40)">
    <ellipse cx="256" cy="410" rx="190" ry="46" fill="url(#portalGrad)" />
    <ellipse cx="256" cy="410" rx="175" ry="40" fill="none" stroke="url(#holoRing)" stroke-width="3" filter="url(#neon-glow-cyan)" />
    <ellipse cx="256" cy="410" rx="140" ry="30" fill="none" stroke="#B6FF00" stroke-width="1.8" stroke-dasharray="14 8" filter="url(#neon-glow-lime)" />
    
    <!-- Floating Orbiting Particles -->
    <circle cx="120" cy="400" r="4" fill="#00F0FF" filter="url(#neon-glow-cyan)" />
    <circle cx="390" cy="415" r="4.5" fill="#B6FF00" filter="url(#neon-glow-lime)" />
    <circle cx="330" cy="430" r="3" fill="#FF007A" />
  </g>

  <!-- Mascot Body & Cyber Hoodie -->
  <g id="mascot-torso">
    <!-- Outer Hoodie Cape / Shoulders -->
    <path d="M 130 360 C 130 310, 180 280, 256 280 C 332 280, 382 310, 382 360 L 400 435 C 360 450, 150 450, 112 435 Z" fill="url(#hoodieGrad)" stroke="#1F2847" stroke-width="2" />
    
    <!-- Neon Lime Seams & Accents -->
    <path d="M 180 295 L 160 430" stroke="#B6FF00" stroke-width="4" stroke-linecap="round" filter="url(#neon-glow-lime)" />
    <path d="M 332 295 L 352 430" stroke="#B6FF00" stroke-width="4" stroke-linecap="round" filter="url(#neon-glow-lime)" />
    <path d="M 230 330 L 230 435 M 282 330 L 282 435" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.8" />
    
    <!-- Cyber Badge on Chest -->
    <rect x="240" y="340" width="32" height="20" rx="4" fill="#070912" stroke="#00F0FF" stroke-width="1.5" />
    <text x="256" y="354" font-family="monospace" font-size="10" font-weight="bold" fill="#B6FF00" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Hands with Cyber Stylus / Tablet -->
  <g id="mascot-hands">
    <!-- Left Hand holding Tablet -->
    <ellipse cx="160" cy="385" rx="18" ry="14" fill="url(#skinGrad)" />
    <rect x="180" y="360" width="85" height="58" rx="8" fill="#0C1022" stroke="#00F0FF" stroke-width="2" transform="rotate(-10 220 390)" filter="url(#neon-glow-cyan)" />
    <line x1="195" y1="375" x2="245" y2="375" stroke="#B6FF00" stroke-width="2" transform="rotate(-10 220 390)" />
    <line x1="195" y1="385" x2="235" y2="385" stroke="#00F0FF" stroke-width="1.5" transform="rotate(-10 220 390)" />
    <line x1="195" y1="395" x2="250" y2="395" stroke="#FF007A" stroke-width="1.5" transform="rotate(-10 220 390)" />

    <!-- Right Hand with Stylus -->
    <ellipse cx="340" cy="385" rx="18" ry="14" fill="url(#skinGrad)" />
    <line x1="330" y1="395" x2="265" y2="375" stroke="#B6FF00" stroke-width="4" stroke-linecap="round" filter="url(#neon-glow-lime)" />
    <circle cx="265" cy="375" r="3.5" fill="#FFFFFF" filter="url(#neon-glow-lime)" />
  </g>

  <!-- Head & Face -->
  <g id="mascot-head">
    <!-- Neck -->
    <path d="M 234 260 L 234 285 L 278 285 L 278 260 Z" fill="#FED8C4" />

    <!-- Face Base -->
    <path d="M 160 170 C 160 90, 352 90, 352 170 C 352 235, 305 275, 256 275 C 207 275, 160 235, 160 170 Z" fill="url(#skinGrad)" />

    <!-- Anime Hair (Back & Bangs) -->
    <path d="M 148 160 C 140 100, 180 40, 256 40 C 332 40, 372 100, 364 160 C 380 185, 375 225, 355 240 C 350 210, 355 180, 348 160 C 330 145, 320 160, 300 135 C 280 165, 260 130, 245 155 C 230 130, 215 155, 195 140 C 180 170, 165 190, 155 235 C 140 215, 138 185, 148 160 Z" fill="url(#hairGrad)" stroke="#1A2035" stroke-width="2" />
    
    <!-- Cyan Glowing Hair Highlights -->
    <path d="M 200 70 C 225 55, 265 55, 290 68" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neon-glow-cyan)" />
    <path d="M 175 110 C 185 95, 205 90, 220 95" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#neon-glow-cyan)" />
    <path d="M 315 90 C 330 100, 340 115, 345 130" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#neon-glow-cyan)" />

    <!-- Cute Anime Blush -->
    <ellipse cx="195" cy="210" rx="14" ry="7" fill="#FF4F93" fill-opacity="0.35" />
    <ellipse cx="317" cy="210" rx="14" ry="7" fill="#FF4F93" fill-opacity="0.35" />

    <!-- Left Eye (Large Anime Cyber Iris) -->
    <g id="left-eye">
      <ellipse cx="205" cy="182" rx="20" ry="24" fill="#0A0E1A" />
      <ellipse cx="205" cy="184" rx="16" ry="20" fill="#00F0FF" filter="url(#neon-glow-cyan)" />
      <ellipse cx="205" cy="186" rx="11" ry="14" fill="#050811" />
      <!-- Code Glyph in Pupil -->
      <text x="205" y="190" font-family="monospace" font-size="9" font-weight="bold" fill="#B6FF00" text-anchor="middle">&lt;</text>
      <!-- Sparkle Highlights -->
      <circle cx="199" cy="174" r="5" fill="#FFFFFF" />
      <circle cx="211" cy="192" r="2.5" fill="#FFFFFF" />
      <!-- Eyelash / Brow -->
      <path d="M 180 162 C 195 152, 220 154, 230 165" stroke="#121729" stroke-width="4.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Eye (Winking or Cheeky Gaze) -->
    <g id="right-eye">
      <ellipse cx="307" cy="182" rx="20" ry="24" fill="#0A0E1A" />
      <ellipse cx="307" cy="184" rx="16" ry="20" fill="#00F0FF" filter="url(#neon-glow-cyan)" />
      <ellipse cx="307" cy="186" rx="11" ry="14" fill="#050811" />
      <!-- Code Glyph in Pupil -->
      <text x="307" y="190" font-family="monospace" font-size="9" font-weight="bold" fill="#B6FF00" text-anchor="middle">&gt;</text>
      <!-- Sparkle Highlights -->
      <circle cx="301" cy="174" r="5" fill="#FFFFFF" />
      <circle cx="313" cy="192" r="2.5" fill="#FFFFFF" />
      <!-- Eyelash / Brow -->
      <path d="M 282 165 C 292 154, 317 152, 332 162" stroke="#121729" stroke-width="4.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Mischievous Cheeky Smirk / Mouth -->
    <path d="M 244 224 C 252 232, 268 232, 274 223 C 274 223, 278 235, 260 236 C 248 235, 244 224, 244 224 Z" fill="#FF4F93" stroke="#251218" stroke-width="1.8" />
    <path d="M 242 222 C 250 230, 268 230, 276 220" stroke="#1A2035" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Cute little fang -->
    <polygon points="264,226 268,231 270,226" fill="#FFFFFF" />
  </g>

  <!-- Cyber Gamer Headset -->
  <g id="headset">
    <!-- Band over head -->
    <path d="M 152 165 C 145 75, 367 75, 360 165" stroke="#141828" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 160 160 C 155 85, 357 85, 352 160" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neon-glow-cyan)" />
    
    <!-- Left Earcup -->
    <rect x="135" y="150" width="22" height="42" rx="8" fill="#0C1020" stroke="#B6FF00" stroke-width="2.5" filter="url(#neon-glow-lime)" />
    <circle cx="146" cy="171" r="5" fill="#00F0FF" />

    <!-- Right Earcup with Mic -->
    <rect x="355" y="150" width="22" height="42" rx="8" fill="#0C1020" stroke="#B6FF00" stroke-width="2.5" filter="url(#neon-glow-lime)" />
    <circle cx="366" cy="171" r="5" fill="#00F0FF" />
    
    <!-- Microphone Boom -->
    <path d="M 360 185 Q 365 230 310 235" stroke="#1E2640" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="308" cy="235" r="4.5" fill="#B6FF00" filter="url(#neon-glow-lime)" />
  </g>

  <!-- Floating Holographic Matrix Windows -->
  <g id="floating-hud">
    <!-- Mini Terminal Box Left -->
    <rect x="55" y="180" width="70" height="42" rx="6" fill="#070914" fill-opacity="0.85" stroke="#00F0FF" stroke-width="1.2" filter="url(#neon-glow-cyan)" />
    <circle cx="67" cy="190" r="2.5" fill="#FF4F93" />
    <circle cx="76" cy="190" r="2.5" fill="#B6FF00" />
    <text x="65" y="206" font-family="monospace" font-size="7" fill="#00F0FF">&gt; RUN dev</text>
    <text x="65" y="215" font-family="monospace" font-size="6.5" fill="#B6FF00">READY 60FPS</text>

    <!-- Mini Terminal Box Right -->
    <rect x="385" y="180" width="75" height="46" rx="6" fill="#070914" fill-opacity="0.85" stroke="#B6FF00" stroke-width="1.2" filter="url(#neon-glow-lime)" />
    <text x="395" y="196" font-family="monospace" font-size="8" font-weight="bold" fill="#B6FF00">WHISPER[X]</text>
    <text x="395" y="208" font-family="monospace" font-size="6.5" fill="#00F0FF">AVx ENGINE</text>
    <text x="395" y="218" font-family="monospace" font-size="6.5" fill="#FF007A">AI MATRIX</text>
  </g>
</svg>
